esphome:
  name: tcl-ac
  friendly_name: TCL Klima

esp8266:
  board: esp07

logger:
  level: VERBOSE
  baud_rate: 0

external_components:
  - source:
      type: git
      url: https://github.com/rzeiler/tcl_ac_esp8266_dongle_esphome.git
      ref: main
    components: [tclac]
    refresh: 5min        
    
uart:
  id: uart_bus
  tx_pin: 1
  rx_pin: 3
  baud_rate: 9600
  parity: EVEN
    
api:
  encryption:
    key: *************************************************

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: TCL Hotspot
    password: ********

captive_portal:

climate:
  - platform: tclac
    id: tcl_custom_climate
    uart_id: uart_bus
    name: "Klimaanlage"